<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = document.getElementById('b'), err = document.getElementById('e');
  btn.disabled = true; btn.textContent = '復号中…'; err.textContent = '';
  try {
    const base = await crypto.subtle.importKey('raw',
      new TextEncoder().encode(document.getElementById('p').value),
      'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(D.salt), iterations:D.iter, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const buf = await crypto.subtle.decrypt(
      {name:'AES-GCM', iv:b64(D.nonce)}, key, b64(D.ct));
    document.open(); document.write(new TextDecoder().decode(buf)); document.close();
  } catch (e) {
    err.textContent = 'パスフレーズが違います';
    btn.disabled = false; btn.textContent = '開く';
  }
});
</script></body></html>
